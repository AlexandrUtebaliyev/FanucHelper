<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сопряжения</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#121417}
a{color:#F5A524}a:hover{color:#FFC25C}
.top{display:flex;align-items:center;gap:8px;height:56px;padding:0 12px 0 4px;border-bottom:1px solid #2C323A}
.back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#ECEFF3;border-radius:10px}
.chip{font:600 12px 'JetBrains Mono',monospace;color:#6FB3FF;border:1px solid #6FB3FF66;background:#6FB3FF1A;border-radius:6px;padding:4px 8px}
.card{background:#1C2026;border:1px solid #2C323A;border-radius:14px}
.seg{display:grid;gap:4px;padding:4px;background:#0E1013;border:1px solid #2C323A;border-radius:12px}
.seg button{height:44px;border:0;border-radius:9px;background:transparent;color:#C7CED8;font:500 13px Inter,sans-serif}
.seg button.on{background:#2C323A;color:#ECEFF3}
.pts{display:grid;grid-template-columns:72px repeat(2,minmax(0,1fr));gap:8px;align-items:center}
.pts span{font-size:13px;color:#9AA4B1}
.pts input{height:46px;width:100%;box-sizing:border-box;padding:0 10px;background:#0E1013;border:1px solid #2C323A;border-radius:10px;color:#ECEFF3;font:500 17px 'JetBrains Mono',monospace}
.pts input.on{border-color:#F5A524;box-shadow:0 0 0 1px #F5A524}
.res{display:grid;grid-template-columns:72px repeat(2,minmax(0,1fr));gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #262B32;font:600 16px 'JetBrains Mono',monospace}
.res span{font:500 13px Inter,sans-serif;color:#9AA4B1}
.code{padding:10px 14px;background:#0E1013;border-radius:10px;font:400 15px/1.7 'JetBrains Mono',ui-monospace,monospace;color:#ECEFF3}
.code div{white-space:pre}
.g{color:#F5A524}.m{color:#FF7AB6}.a{color:#7DB8FF}.f{color:#6FD08C}.p{color:#C9A2FF}.n{color:#8B95A3}.c{color:#8B95A3;font-style:italic}.v{color:#5FD3D3}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 14px;border-radius:12px;font:600 15px Inter,sans-serif;border:1px solid #2C323A;background:#1C2026;color:#ECEFF3}
.btn.pri{background:#F5A524;border-color:#F5A524;color:#141210}
.h2{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#9AA4B1}
.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid #2C323A;background:#16191D}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 16px;font-size:12px;color:#9AA4B1;text-decoration:none}
.nav a.on{color:#F5A524}
</style>
</helmet>
<div style="width:390px;height:1060px;box-sizing:border-box;display:flex;flex-direction:column;background:#121417;color:#ECEFF3;font-family:Inter,system-ui,sans-serif">
  <header class="top">
    <a class="back" href="MainMF.dc.html" aria-label="Назад"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <h1 style="margin:0;flex:1;font-size:20px;font-weight:600">Сопряжения</h1>
    <span class="chip">G17</span>
  </header>

  <div style="display:flex;flex-direction:column;gap:12px;padding:12px 16px">
    <div class="seg" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <button class="on" type="button">Прямая–прямая</button>
      <button type="button">Прямая–дуга</button>
      <button type="button">Дуга–дуга</button>
    </div>

    <div class="card" style="padding:6px">
      <svg width="100%" viewBox="0 0 340 160" role="img" aria-label="Вид сверху: прямая вдоль X до угла 50,0, затем вверх до 50,30, угол скруглён R5">
        <path d="M40 140 L240 140 L240 20" fill="none" stroke="#5A626D" stroke-width="1.5" stroke-dasharray="4 4"></path>
        <path d="M40 140 L220 140 A20 20 0 0 0 240 120 L240 20" fill="none" stroke="#ECEFF3" stroke-width="2.5"></path>
        <path d="M220 140 A20 20 0 0 0 240 120" fill="none" stroke="#F5A524" stroke-width="3.5"></path>
        <circle cx="220" cy="120" r="3" fill="#7DB8FF"></circle>
        <circle cx="220" cy="140" r="5" fill="#F5A524"></circle>
        <circle cx="240" cy="120" r="5" fill="#F5A524"></circle>
        <circle cx="40" cy="140" r="4" fill="#9AA4B1"></circle>
        <text x="196" y="156" fill="#F5A524" font-size="12" font-weight="700" font-family="JetBrains Mono">T1</text>
        <text x="250" y="124" fill="#F5A524" font-size="12" font-weight="700" font-family="JetBrains Mono">T2</text>
        <text x="190" y="114" fill="#7DB8FF" font-size="11" font-family="JetBrains Mono">C</text>
        <text x="40" y="130" fill="#9AA4B1" font-size="11" font-family="JetBrains Mono">P1 0,0</text>
        <text x="250" y="28" fill="#9AA4B1" font-size="11" font-family="JetBrains Mono">P2 50,30</text>
        <text x="200" y="96" fill="#C7CED8" font-size="12" font-family="JetBrains Mono">R5</text>
      </svg>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <div class="pts"><span></span><span>X</span><span>Y</span></div>
      <div class="pts"><span>Старт P1</span><input aria-label="X старта" value="0"><input aria-label="Y старта" value="0"></div>
      <div class="pts"><span>Угол</span><input aria-label="X угла" value="50"><input aria-label="Y угла" value="0"></div>
      <div class="pts"><span>Конец P2</span><input aria-label="X конца" value="50"><input aria-label="Y конца" value="30"></div>
      <div class="pts"><span>Радиус</span><input class="on" aria-label="Радиус скругления" value="5"><span style="padding-left:4px">мм</span></div>
    </div>

    <div class="card" style="padding:2px 14px">
      <div class="res"><span style="color:#F5A524">T1</span><div>X45.</div><div>Y0.</div></div>
      <div class="res"><span style="color:#F5A524">T2</span><div>X50.</div><div>Y5.</div></div>
      <div class="res"><span style="color:#7DB8FF">Центр</span><div>X45.</div><div>Y5.</div></div>
      <div class="res" style="border-bottom:0"><span>Дуга</span><div style="grid-column:span 2;font:500 14px Inter,sans-serif">G03 — против часовой, 90°</div></div>
    </div>

    <section>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <h2 class="h2" style="margin:0">G-код</h2>
        <div class="seg" style="grid-template-columns:repeat(2,minmax(0,1fr));padding:2px;width:130px">
          <button class="on" type="button" style="height:32px;font-family:'JetBrains Mono'">R</button>
          <button type="button" style="height:32px;font-family:'JetBrains Mono'">I J</button>
        </div>
      </div>
      <div class="code">
        <div><span class="g">G01</span> <span class="a">X45.</span> <span class="a">Y0.</span> <span class="f">F300.</span></div>
        <div><span class="g">G03</span> <span class="a">X50.</span> <span class="a">Y5.</span> <span class="a">R5.</span></div>
        <div><span class="g">G01</span> <span class="a">Y30.</span></div>
      </div>
      <div style="margin-top:6px;font:500 12px 'JetBrains Mono',monospace;color:#9AA4B1">I J: G03 X50. Y5. I0. J5.</div>
    </section>

    <div style="display:flex;gap:10px">
      <button class="btn" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"></path></svg>Копировать</button>
      <a class="btn pri" href="Program.dc.html" style="text-decoration:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>В программу</a>
    </div>
  </div>

  <nav class="nav" aria-label="Разделы" style="margin-top:auto">
    <a class="on" href="MainMF.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"></path></svg>Расчёты</a>
    <a href="Program.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M10 13l-2 2 2 2M14 13l2 2-2 2"></path></svg>Программа</a>
    <a href="Library.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Библиотека</a>
    <a href="Settings.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>Настройки</a>
  </nav>
</div>
</x-dc>

  renderVals() {

  }

</body>
</html>
