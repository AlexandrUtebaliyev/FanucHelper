<!doctype html>

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#121417}
a{color:#F5A524}a:hover{color:#FFC25C}
.top{display:flex;align-items:center;gap:8px;height:56px;padding:0 12px 0 4px;border-bottom:1px solid #2C323A}
.back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#ECEFF3;border-radius:10px}
.chip{font:600 12px 'JetBrains Mono',monospace;color:#F5A524;border:1px solid #F5A52466;background:#F5A5241A;border-radius:6px;padding:4px 8px}
.card{background:#1C2026;border:1px solid #2C323A;border-radius:14px}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid #2C323A;border-radius:10px;background:#1C2026;color:#ECEFF3}
.ib.pri{background:#F5A524;border-color:#F5A524;color:#141210}
.tg{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:18px;border:1px solid #2C323A;background:transparent;color:#C7CED8;font:500 13px Inter,sans-serif}
.tg.on{background:#2C323A;color:#ECEFF3;border-color:#3A414B}
.lst{font:400 14px/1 'JetBrains Mono',monospace}
.lst div{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;height:36px;padding:0 12px;border-bottom:1px solid #262B32;white-space:pre}
.lst div b{font-weight:600;color:#9AA4B1;font-size:12px}
.lst div.on{background:#FF7AB61F;box-shadow:inset 3px 0 0 #FF7AB6}
.g{color:#F5A524}.m{color:#FF7AB6}.a{color:#7DB8FF}.f{color:#6FD08C}.p{color:#C9A2FF}.n{color:#8B95A3}.c{color:#8B95A3;font-style:italic}.v{color:#5FD3D3}
.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid #2C323A;background:#16191D}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 16px;font-size:12px;color:#9AA4B1;text-decoration:none}
.nav a.on{color:#F5A524}
</style>
</helmet>

    <h1 style="margin:0;flex:1;font-size:20px;font-weight:600">Проверка траектории</h1>

  <div style="display:flex;flex-direction:column;gap:12px;padding:12px 16px">

        <path d="M0 26H350M0 66H350M0 106H350M0 146H350M0 186H350M0 226H350M30 0V260M100 0V260M170 0V260M240 0V260M310 0V260" stroke="#1C2026"></path>
        <line x1="0" y1="230" x2="350" y2="230" stroke="#3A414B" stroke-dasharray="8 4 2 4"></line>
        <rect x="26" y="76" width="294" height="154" fill="#1C2026" fill-opacity="0.6" stroke="#3A414B" stroke-dasharray="3 3"></rect>
        <path d="M320 167 L313 160 L215 160 L215 128.5 A3.5 3.5 0 0 0 211.5 125 L40 125 L40 83 L26 83 L26 230 L320 230 Z" fill="#2C323A"></path>

        <path d="M215 128.5 A3.5 3.5 0 0 0 211.5 125" fill="none" stroke="#FF7AB6" stroke-width="5" stroke-linecap="round"></path>
        <path d="M211.5 125 L40 125 L40 83" fill="none" stroke="#F5A524" stroke-width="2.5" stroke-opacity="0.35" stroke-linejoin="round"></path>

        <circle cx="211.5" cy="125" r="11" fill="none" stroke="#FF7AB6" stroke-width="2"></circle>
        <circle cx="211.5" cy="125" r="4" fill="#FF7AB6"></circle>
        <circle cx="40" cy="125" r="4" fill="#5A626D"></circle>
        <circle cx="40" cy="83" r="4" fill="#5A626D"></circle>

          <text x="340" y="70" fill="#7DB8FF" text-anchor="end">0</text>
          <text x="340" y="184" fill="#C7CED8" text-anchor="end">1</text>
          <text x="322" y="184" fill="#C7CED8">2</text>
          <text x="304" y="152" fill="#C7CED8">3</text>
          <text x="219" y="176" fill="#C7CED8">4</text>
          <text x="222" y="136" fill="#C7CED8">5</text>
          <text x="196" y="110" fill="#FF7AB6">6</text>

          <text x="46" y="78" fill="#8B95A3">8</text>

        <g font-family="JetBrains Mono" font-size="10" fill="#9AA4B1">

          <text x="6" y="246">Z−40</text>
          <text x="232" y="246">+Z →</text>
          <text x="6" y="16">X ↑ (на Ø)</text>
        </g>
      </svg>
      <div style="position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px">
        <button class="ib" type="button" aria-label="Приблизить" style="width:36px;height:36px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
        <button class="ib" type="button" aria-label="Отдалить" style="width:36px;height:36px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
        <button class="ib" type="button" aria-label="Вписать целиком" style="width:36px;height:36px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg></button>
      </div>

    <div style="display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:#C7CED8">

      <span style="display:flex;align-items:center;gap:6px"><svg width="22" height="6" aria-hidden="true"><line x1="0" y1="3" x2="22" y2="3" stroke="#F5A524" stroke-width="2.5"></line></svg>G01</span>
      <span style="display:flex;align-items:center;gap:6px"><svg width="22" height="6" aria-hidden="true"><line x1="0" y1="3" x2="22" y2="3" stroke="#FF7AB6" stroke-width="3"></line></svg>G02/G03</span>
      <span style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:10px;background:#2C323A;border-radius:2px"></span>деталь</span>
    </div>

    <div style="display:flex;align-items:center;gap:8px">
      <button class="ib" type="button" aria-label="В начало"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14l-10-7z"></path></svg></button>

      <div style="flex:1;text-align:center">
        <div style="font:700 18px 'JetBrains Mono',monospace">6 / 9</div>
        <div style="font-size:11px;color:#9AA4B1">кадр</div>
      </div>
      <button class="ib pri" type="button" aria-label="Следующий кадр"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
      <button class="ib" type="button" aria-label="Воспроизвести"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg></button>

    <div class="card" style="padding:12px 14px;border-color:#FF7AB6">
      <div style="font:500 15px 'JetBrains Mono',monospace;white-space:pre"><span class="g">G03</span> <span class="a">X30.</span> <span class="a">Z-15.5</span> <span class="a">R0.5</span></div>
      <div style="display:flex;gap:16px;margin-top:6px;font:500 13px 'JetBrains Mono',monospace;color:#9AA4B1">
        <span>Ø30.000</span><span>Z−15.500</span><span>дуга 90° против час.</span>
      </div>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <button class="tg on" type="button">Номера точек</button>
      <button class="tg on" type="button">G00</button>
      <button class="tg" type="button">Черновые проходы</button>
      <button class="tg" type="button">Пластина r0.8</button>

    <div style="display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;background:#16241A;border:1px solid #2E5A3A">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6FD08C" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
      <span style="font-size:13px;color:#BFE8CB">Подвод G00 вне заготовки · дуги сходятся · Z не заходит в патрон</span>
    </div>

    <section class="card lst" style="overflow:hidden;max-height:182px;overflow-y:auto">
      <div><b>4</b><span><span class="a">X20.</span> <span class="a">Z-1.</span></span></div>
      <div><b>5</b><span><span class="a">Z-15.</span></span></div>
      <div><b>5</b><span><span class="a">X29.</span></span></div>
      <div class="on"><b style="color:#FF7AB6">6</b><span><span class="g">G03</span> <span class="a">X30.</span> <span class="a">Z-15.5</span> <span class="a">R0.5</span></span></div>
      <div><b>7</b><span><span class="g">G01</span> <span class="a">Z-40.</span></span></div>
      <div style="border-bottom:0"><b>8</b><span><span class="n">N60</span> <span class="a">X42.</span></span></div>
    </section>
