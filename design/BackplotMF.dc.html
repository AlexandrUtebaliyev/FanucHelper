<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#121417}
a{color:#F5A524}a:hover{color:#FFC25C}
.top{display:flex;align-items:center;gap:8px;height:56px;padding:0 12px 0 4px;border-bottom:1px solid #2C323A}
.back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#ECEFF3;border-radius:10px}
.chip{font:600 12px 'JetBrains Mono',monospace;color:#6FB3FF;border:1px solid #6FB3FF66;background:#6FB3FF1A;border-radius:6px;padding:4px 8px}
.card{background:#1C2026;border:1px solid #2C323A;border-radius:14px}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid #2C323A;border-radius:10px;background:#1C2026;color:#ECEFF3}
.ib.pri{background:#F5A524;border-color:#F5A524;color:#141210}
.seg{display:grid;gap:3px;padding:3px;background:#0E1013;border:1px solid #2C323A;border-radius:10px}
.seg button{height:34px;border:0;border-radius:8px;background:transparent;color:#C7CED8;font:600 13px 'JetBrains Mono',monospace}
.seg button.on{background:#2C323A;color:#ECEFF3}
.tg{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:18px;border:1px solid #2C323A;background:transparent;color:#C7CED8;font:500 13px Inter,sans-serif}
.tg.on{background:#2C323A;color:#ECEFF3;border-color:#3A414B}
.g{color:#F5A524}.m{color:#FF7AB6}.a{color:#7DB8FF}.f{color:#6FD08C}.p{color:#C9A2FF}.n{color:#8B95A3}.c{color:#8B95A3;font-style:italic}.v{color:#5FD3D3}
.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid #2C323A;background:#16191D}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 16px;font-size:12px;color:#9AA4B1;text-decoration:none}
.nav a.on{color:#F5A524}
</style>
</helmet>

    <h1 style="margin:0;flex:1;font-size:20px;font-weight:600">Проверка траектории</h1>
    <span class="chip">G81 · 6 отв.</span>
  </header>

  <div style="display:flex;flex-direction:column;gap:12px;padding:12px 16px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div class="seg" style="grid-template-columns:repeat(2,minmax(0,1fr));width:140px">
        <button class="on" type="button">X Y</button>
        <button type="button">X Z</button>
      </div>
      <span style="font-size:12px;color:#9AA4B1">вид сверху, G54</span>
    </div>

    <div class="card" style="padding:0;overflow:hidden;position:relative">
      <svg width="100%" viewBox="0 0 350 250" role="img" aria-label="Вид сверху: 6 отверстий по окружности R50, обход по порядку, отверстия 1 и 2 готовы, текущее — 3" style="display:block;background:#0E1013">
        <path d="M0 35H350M0 80H350M0 125H350M0 170H350M0 215H350M40 0V250M85 0V250M130 0V250M175 0V250M220 0V250M265 0V250M310 0V250" stroke="#1C2026"></path>
        <line x1="0" y1="125" x2="350" y2="125" stroke="#3A414B" stroke-dasharray="8 4 2 4"></line>

        <circle cx="85" cy="125" r="8" fill="none" stroke="#5A626D" stroke-width="2"></circle>
        <circle cx="130" cy="202.9" r="8" fill="none" stroke="#5A626D" stroke-width="2"></circle>
        <circle cx="220" cy="202.9" r="8" fill="none" stroke="#5A626D" stroke-width="2"></circle>

          <text x="232" y="40" fill="#6FD08C">2</text>

          <text x="64" y="129" fill="#8B95A3">4</text>
          <text x="110" y="226" fill="#8B95A3">5</text>
          <text x="232" y="226" fill="#8B95A3">6</text>
        </g>
        <g font-family="JetBrains Mono" font-size="10" fill="#9AA4B1">

          <text x="181" y="12">+Y</text>
          <text x="181" y="140">0,0</text>

      <svg width="100%" viewBox="0 0 330 70" role="img" aria-label="Профиль по Z: исходная плоскость, плоскость R2, дно Z-10; возврат на R">
        <line x1="0" y1="10" x2="330" y2="10" stroke="#3A414B" stroke-dasharray="4 4"></line>

        <rect x="150" y="32" width="30" height="34" fill="#2C323A"></rect>

        <path d="M172 64 V24" stroke="#7DB8FF" stroke-width="2" stroke-dasharray="4 3"></path>

          <text x="4" y="22" fill="#C9A2FF">R2.</text>
          <text x="4" y="44" fill="#9AA4B1">Z0 деталь</text>
          <text x="190" y="66" fill="#F5A524">Z-10.</text>
          <text x="232" y="22" fill="#7DB8FF">G99 → на R</text>

    <div style="display:flex;align-items:center;gap:8px">
      <button class="ib" type="button" aria-label="В начало"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14l-10-7z"></path></svg></button>
      <button class="ib" type="button" aria-label="Предыдущий кадр"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
      <div style="flex:1;text-align:center">
        <div style="font:700 18px 'JetBrains Mono',monospace">3 / 6</div>
        <div style="font-size:11px;color:#9AA4B1">отверстие</div>
      </div>
      <button class="ib pri" type="button" aria-label="Следующий кадр"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>

      <div style="display:flex;gap:16px;margin-top:6px;font:500 13px 'JetBrains Mono',monospace;color:#9AA4B1">

      </div>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <button class="tg on" type="button">Номера</button>
      <button class="tg on" type="button">G00</button>
      <button class="tg" type="button">Контур заготовки</button>
    </div>

    <div style="display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;background:#16241A;border:1px solid #2E5A3A">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6FD08C" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
      <span style="font-size:13px;color:#BFE8CB">R выше детали · на последнем отверстии G98 · G80 есть</span>
    </div>
  </div>
