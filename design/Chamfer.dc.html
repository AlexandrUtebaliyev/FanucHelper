<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Фаска / радиус</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#121417}
a{color:#F5A524}a:hover{color:#FFC25C}
.top{display:flex;align-items:center;gap:8px;height:56px;padding:0 12px 0 4px;border-bottom:1px solid #2C323A}
.back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#ECEFF3;border-radius:10px}
.chip{font:600 12px 'JetBrains Mono',monospace;color:#6FB3FF;border:1px solid #6FB3FF66;background:#6FB3FF1A;border-radius:6px;padding:4px 8px}
.card{background:#1C2026;border:1px solid #2C323A;border-radius:14px}
.lbl{display:block;font-size:13px;color:#9AA4B1;margin-bottom:6px}
.fld{display:flex;align-items:center;gap:8px;height:52px;box-sizing:border-box;background:#0E1013;border:1px solid #2C323A;border-radius:10px;padding:0 12px}
.fld.on{border-color:#F5A524;box-shadow:0 0 0 1px #F5A524}
.fld input{flex:1;min-width:0;width:100%;background:transparent;border:0;outline:none;color:#ECEFF3;font:500 20px 'JetBrains Mono',ui-monospace,monospace}
.fld span{font-size:14px;color:#9AA4B1}
.seg{display:grid;gap:4px;padding:4px;background:#0E1013;border:1px solid #2C323A;border-radius:12px}
.seg button{height:44px;border:0;border-radius:9px;background:transparent;color:#C7CED8;font:500 14px Inter,sans-serif}
.seg button.on{background:#2C323A;color:#ECEFF3}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;min-height:76px;border-radius:12px;border:1px solid #2C323A;background:#1C2026;color:#C7CED8;font:500 12px Inter,sans-serif}
.pick button.on{border-color:#F5A524;color:#ECEFF3;box-shadow:0 0 0 1px #F5A524}
.code{padding:12px 14px;background:#0E1013;border-radius:10px;font:400 15px/1.7 'JetBrains Mono',ui-monospace,monospace;color:#ECEFF3}
.code div{white-space:pre}
.g{color:#F5A524}.m{color:#FF7AB6}.a{color:#7DB8FF}.f{color:#6FD08C}.p{color:#C9A2FF}.n{color:#8B95A3}.c{color:#8B95A3;font-style:italic}.v{color:#5FD3D3}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 14px;border-radius:12px;font:600 15px Inter,sans-serif;border:1px solid #2C323A;background:#1C2026;color:#ECEFF3}
.btn.pri{background:#F5A524;border-color:#F5A524;color:#141210}
.pt{display:grid;grid-template-columns:44px 1fr 1fr;align-items:center;padding:10px 0;border-bottom:1px solid #262B32;font:600 17px 'JetBrains Mono',monospace}
.pt span{font:500 13px Inter,sans-serif;color:#9AA4B1}
.h2{margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#9AA4B1}
.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid #2C323A;background:#16191D}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 16px;font-size:12px;color:#9AA4B1;text-decoration:none}
.nav a.on{color:#F5A524}
</style>
</helmet>
<div style="width:390px;height:1060px;box-sizing:border-box;display:flex;flex-direction:column;background:#121417;color:#ECEFF3;font-family:Inter,system-ui,sans-serif">
  <header class="top">
    <a class="back" href="Main.dc.html" aria-label="Назад"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <h1 style="margin:0;flex:1;font-size:20px;font-weight:600">Фаска / радиус</h1>
    <span class="chip">0i-TF · A</span>
  </header>

  <div style="display:flex;flex-direction:column;gap:16px;padding:16px">
    <div class="seg" style="grid-template-columns:repeat(2,minmax(0,1fr))">
      <button class="on" type="button">Фаска C</button>
      <button type="button">Радиус R</button>
    </div>

    <div>
      <div class="lbl">Где стоит</div>
      <div class="pick">
        <button class="on" type="button"><svg width="36" height="28" viewBox="0 0 36 28" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 6h22l8 8v12"></path></svg>Торец → Ø</button>
        <button type="button"><svg width="36" height="28" viewBox="0 0 36 28" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 20h10l8-8h14"></path></svg>Ø → уступ</button>
        <button type="button"><svg width="36" height="28" viewBox="0 0 36 28" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 8h14l16 12"></path></svg>Ø → конус</button>
      </div>
    </div>

    <div class="card" style="padding:8px">
      <svg width="100%" viewBox="0 0 340 150" role="img" aria-label="Эскиз фаски 2×45° на торце Ø40">
        <line x1="10" y1="132" x2="330" y2="132" stroke="#3A414B" stroke-dasharray="8 4 2 4"></line>
        <path d="M20 42 L250 42 L280 72 L280 132 L20 132 Z" fill="#232830"></path>
        <path d="M20 42 L250 42 L280 72 L280 132" fill="none" stroke="#ECEFF3" stroke-width="2"></path>
        <path d="M250 42 L280 72" stroke="#F5A524" stroke-width="3"></path>
        <circle cx="280" cy="72" r="5" fill="#F5A524"></circle>
        <circle cx="250" cy="42" r="5" fill="#F5A524"></circle>
        <text x="290" y="76" fill="#F5A524" font-size="12" font-weight="700" font-family="JetBrains Mono">P1</text>
        <text x="236" y="32" fill="#F5A524" font-size="12" font-weight="700" font-family="JetBrains Mono">P2</text>
        <text x="60" y="34" fill="#C7CED8" font-size="12" font-family="JetBrains Mono">Ø40</text>
        <text x="196" y="72" fill="#C7CED8" font-size="12" font-family="JetBrains Mono">2×45°</text>
      </svg>
    </div>

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
      <div><label class="lbl" for="cD">Ø детали</label><div class="fld"><input id="cD" inputmode="decimal" value="40"><span>мм</span></div></div>
      <div><label class="lbl" for="cZ">Z торца</label><div class="fld"><input id="cZ" inputmode="decimal" value="0"><span>мм</span></div></div>
      <div><label class="lbl" for="cC">Катет фаски</label><div class="fld on"><input id="cC" inputmode="decimal" value="2"><span>мм</span></div></div>
      <div><label class="lbl" for="cA">Угол</label><div class="fld"><input id="cA" inputmode="decimal" value="45"><span>°</span></div></div>
    </div>

    <div class="card" style="padding:2px 16px">
      <div class="pt"><b style="color:#F5A524">P1</b><div>X36.</div><div>Z0.</div></div>
      <div class="pt" style="border-bottom:0"><b style="color:#F5A524">P2</b><div>X40.</div><div>Z-2.</div></div>
    </div>

    <section>
      <h2 class="h2">G-код</h2>
      <div class="code">
        <div><span class="g">G00</span> <span class="a">X36.</span> <span class="a">Z2.</span></div>
        <div><span class="g">G01</span> <span class="a">Z0.</span> <span class="f">F0.15</span></div>
        <div><span class="g">G01</span> <span class="a">X40.</span> <span class="a">Z-2.</span></div>
      </div>
    </section>

    <div style="display:flex;gap:10px">
      <button class="btn" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"></path></svg>Копировать</button>
      <a class="btn pri" href="Program.dc.html" style="text-decoration:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>В программу</a>
    </div>
  </div>

  <nav class="nav" aria-label="Разделы" style="margin-top:auto">
    <a class="on" href="Main.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"></path></svg>Расчёты</a>
    <a href="Program.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M10 13l-2 2 2 2M14 13l2 2-2 2"></path></svg>Программа</a>
    <a href="Library.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Библиотека</a>
    <a href="Settings.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>Настройки</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
